<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物理实验室 —— 开放实验平台</title>
<link rel="stylesheet" href="css/platform.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-logo">🔬</span><span class="brand-text">物理实验室</span></div>
    <div class="scene-tabs" id="sceneTabs"></div>
    <button class="icon-btn primary" id="btnNewScene" title="新建实验">＋</button>
    <button class="icon-btn" id="panelToggle" title="收起 / 展开面板">«</button>
  </header>
  <main id="main">
    <div id="stage">
      <canvas id="c"></canvas>
      <div class="hud" id="hud"></div>
    </div>
    <aside id="panel"><div class="panel-body" id="panelBody"></div></aside>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
